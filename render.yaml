services:
  - type: web
    runtime: static
    name: pet-ink-fortune
    buildCommand: node scripts/configure.cjs
    staticPublishPath: dist
    autoDeploy: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
